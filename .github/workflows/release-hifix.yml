name: Release Ice HiFix

on:
  push:
    tags:
      - "hifix-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Select Xcode 26.6
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app

      - name: Import stable signing identity
        env:
          CERTIFICATE_P12: ${{ secrets.HIFIX_SIGNING_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.HIFIX_SIGNING_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.HIFIX_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/hifix-signing.p12"
          CERTIFICATE_PEM="$RUNNER_TEMP/hifix-signing.pem"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$CERTIFICATE_PATH"
          KEYCHAIN_PATH="$RUNNER_TEMP/hifix-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          openssl pkcs12 \
            -legacy \
            -in "$CERTIFICATE_PATH" \
            -nokeys \
            -passin "pass:$CERTIFICATE_PASSWORD" \
            -out "$CERTIFICATE_PEM"
          sudo security add-trusted-cert \
            -d \
            -r trustRoot \
            -p codeSign \
            -k /Library/Keychains/System.keychain \
            "$CERTIFICATE_PEM"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build release
        run: |
          DERIVED_DATA_PATH="$RUNNER_TEMP/IceHiFixDerivedData"
          xcodebuild \
            -project Ice.xcodeproj \
            -scheme Ice \
            -configuration Release \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            clean build

      - name: Verify and package application
        run: |
          DERIVED_DATA_PATH="$RUNNER_TEMP/IceHiFixDerivedData"
          ARCHIVE_PATH="$RUNNER_TEMP/Ice-HiFix.zip"
          APP_PATH="$DERIVED_DATA_PATH/Build/Products/Release/Ice-HiFix.app"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          test "$(codesign -dvv "$APP_PATH" 2>&1 | sed -n 's/^Authority=//p')" = \
            "Ice-HiFix-Local-Code-Signing"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ARCHIVE_PATH"
          shasum -a 256 "$ARCHIVE_PATH" > "$ARCHIVE_PATH.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARCHIVE_PATH="$RUNNER_TEMP/Ice-HiFix.zip"
          gh release create "$RELEASE_TAG" \
            "$ARCHIVE_PATH" \
            "$ARCHIVE_PATH.sha256" \
            --verify-tag \
            --title "Ice HiFix $RELEASE_TAG" \
            --notes "Based on Ice 0.11.13-dev.2. Restores Hi to its saved visible menu bar position after Hi restarts. Includes the ad-hoc XPC and update-prompt compatibility fixes."

      - name: Remove temporary keychain
        if: always()
        run: |
          sudo security delete-certificate \
            -Z 8C9978A43950D795D48AE6D607142BE1B538C994 \
            /Library/Keychains/System.keychain || true
          security delete-keychain "$RUNNER_TEMP/hifix-signing.keychain-db" || true
